[project]
name = "notebooklm-mcp"
version = "0.9.28"
description = "Thin self-built MCP server over notebooklm-py for NotebookLM automation"
# 鎖 3.12:3.13+ 未驗過(原記在 AGENTS.md,2026-08-30 隨 pin 搬來)。
# 當初另一半理由「3.14 會觸發 notebooklm-py 的 inspect.signature bug」已被上游 0.8.2 #2268 修掉,
# 上游 CI 現在跑 3.10–3.14 全矩陣 —— 所以這道 ceiling 現在**只剩「我方未驗」**這一個理由,可談。
requires-python = ">=3.12,<3.13"
dependencies = [
    # 0.8.0 落地 ADR-0019 的錯誤契約(#1346):「缺席與拒絕 raise;回傳只表達成功與
    # 非同步生命週期」。對我們最有感的兩條:生成 kickoff 的同步拒絕改成 raise
    # (見 tools_podcast._REFUSED_WITHOUT_DISPATCH),以及 rename(return_object=False)
    # 不再短路。上界照舊是硬需求——`uv tool install git+…` 不讀 uv.lock。
    # 下界 0.8.1→0.8.2:0.8.2 拆出 web / android 兩個 backend,公開 facade 變成 ABC、
    # web 實作搬到 `notebooklm._web.*`,`tests/test_contracts.py` 的 getsource 斷言
    # 因此釘在 `_web.*`(在 0.8.1 不存在)。**production code 兩版都跑得起來**,
    # 抬下界是為了讓「測的」與「裝的」是同一版,不是功能需求。
    # 下界 0.8.3→0.8.4:消費端全新安裝已解析到 0.8.4,同上理由讓測的=裝的;0.8.4 的 set_users 多了 readback 驗證(見 CHANGELOG v0.9.29)。
    "notebooklm-py>=0.8.4,<0.9",
    # 上界是硬需求:`uv tool install git+…` **不讀 uv.lock**,消費端每次安裝都自由解析成
    # 當下最新,所以無上界的話 mcp 2.0 一出來,四台機器下一次重裝就靜默吃到 breaking 版本。
    # 下界 1.28.1 = 第一個沒有已知 advisory 的版本(GHSA-jpw9-pfvf-9f58、GHSA-hvrp-rf83-w775 於 1.27.2 修;
    # GHSA-vj7q-gjh5-988w 於 1.28.1 修);跑不跑得起來由 deps-watch 的 lowest-direct job 驗。上游 migration guide 原文:
    # 「keep a `<2` upper bound until you've migrated」。**實際跑過的組合會漂,這裡要跟著更新**:2026-08-09
    # 一度漂成「lock 1.28.1 / 生產實裝 1.29.0」,已把 lock 拉到 1.29.0 對齊並跑過全套。
    # (1.29.0 啟動多印一行 pydantic_settings 的 IncompleteFieldDefinitionWarning,
    #  走 stderr 不影響 stdio 協定 —— 但它正是「測試與實跑不同版」會漏掉的那種差異。)
    "mcp[cli]>=1.28.1,<2",
    # 下界 12.3 = 第一個沒有已知 advisory 的版本(11.3.0 有 18 筆,修正只出在 12.x)。我們只用 open/convert('RGB')/save JPEG,
    # 12.0 移除的 API 都沒用到;合成圖探測 11.3→12.3 的 JPEG bytes 相同,但沒用真實 Chrome 封面驗過 ——
    # 已發布的 JPEG 是事實來源,只有重產封面才可能換 content-hash URL。上界理由同上(不讀 lock)。
    "Pillow>=12.3,<13",
    "httpx>=0.27,<1",
    # 上界是硬需求,理由跟上面兩個依賴一樣(uv tool install git+… 不讀 uv.lock)——這支
    # 之前漏了,是本檔唯一無上界的直接依賴。notes_html 拿它做半信任的 Markdown 渲染,
    # 4.0 若改 extension 語意,允許清單可能靜默拒收,失敗形狀是「(某集)講義發不出去」。
    # 下界 3.8.1:CVE-2025-69534(畸形類 HTML 序列讓 HTMLParser 拋未捕捉的 AssertionError,正是「講義發不出去」那種失敗)。
    "markdown>=3.8.1,<4",
    "mutagen>=1.47,<2",   # 把單集封面內嵌進 true MP3 的 ID3/APIC
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
# Only the LOCAL login machine needs a browser; the 3 VMs auth via Doppler
# (NOTEBOOKLM_AUTH_JSON) and never install this. After installing, run:
#   uv run playwright install chromium
login = ["notebooklm-py[browser]>=0.8.4,<0.9"]

[project.scripts]
# ⚠️ 命令叫 `nblm-mcp` 而不是 `notebooklm-mcp`,是因為 **notebooklm-py 0.8.0 自己也宣告了一支
# `notebooklm-mcp`**(它自己的 MCP server)。兩個套件裝在同一個 uv tool venv 裡,bin/ 只會留
# 最後寫入的那份 —— 實測全新 `uv tool install` **3/3 都是上游贏**,而上游那支沒有 `fastmcp`
# 就 ModuleNotFoundError,等於裝完就是壞的。改名是唯一能讓它「確定性正確」的辦法
# (留著舊名只會變成升級裝有時好、全新裝一定壞的不決定性)。詳見
# docs/notebooklm-py-0.8-upgrade.md。`notebooklm-cover` 不撞名,維持原樣。
nblm-mcp = "notebooklm_mcp.server:main"
notebooklm-cover = "notebooklm_mcp.cover_cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["notebooklm_mcp"]
# 註:assets/*.html(封面 template)在 notebooklm_mcp 套件目錄內,hatchling 預設就會打包進 wheel;
# 別再加 force-include(會與預設收錄撞成「same path」build error)。

[build-system]
# 消費端 uv tool install git+… 從原始碼建 wheel,build 隔離環境也不讀 lock;1.27 與 1.32.4 建出的 wheel 檔案清單實測相同。
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
