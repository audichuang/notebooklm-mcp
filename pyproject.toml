[project]
name = "notebooklm-mcp"
version = "0.5.0"
description = "Thin self-built MCP server over notebooklm-py for NotebookLM automation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "notebooklm-py>=0.7.3,<0.8",
    # 上界是硬需求:`uv tool install git+…` **不讀 uv.lock**,消費端每次安裝都自由解析成
    # 當下最新,所以無上界的話 mcp 2.0 一出來,四台機器下一次重裝就靜默吃到 breaking 版本。
    # 下界 1.27 = 實測過的最舊版(1.27.2 為 lock、1.28.1 為生產實裝,兩者全套測試皆綠)。
    "mcp[cli]>=1.27,<2",
    "Pillow>=10,<12",
    "httpx>=0.27,<1",
    "markdown>=3.5",
    "mutagen>=1.47,<2",   # 把單集封面內嵌進 true MP3 的 ID3/APIC
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
# Only the LOCAL login machine needs a browser; the 3 VMs auth via Doppler
# (NOTEBOOKLM_AUTH_JSON) and never install this. After installing, run:
#   uv run playwright install chromium
login = ["notebooklm-py[browser]>=0.7.3,<0.8"]

[project.scripts]
notebooklm-mcp = "notebooklm_mcp.server:main"
notebooklm-cover = "notebooklm_mcp.cover_cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["notebooklm_mcp"]
# 註:assets/*.html(封面 template)在 notebooklm_mcp 套件目錄內,hatchling 預設就會打包進 wheel;
# 別再加 force-include(會與預設收錄撞成「same path」build error)。

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
