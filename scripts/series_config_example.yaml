# Podcast 自動化生成配置檔範例
# 用法:
#   uv run scripts/episodic_podcast.py --config series_config_example.yaml --dry-run
#   uv run scripts/episodic_podcast.py --config series_config_example.yaml --dry-run

series:
  name: "深入白鯨記"
  notebook_title: "深入白鯨記 — 文學探討系列"  # 可選，筆記本標題（預設用 name）
  notebook_id: null  # null = 自動建立; 或填入現有筆記本 ID
  hosts:
    host_a: "Leo"
    host_b: "Ruby"
  style: "深度探討、學術但不枯燥、帶有幽默感"
  language: "zh_Hant"   # zh_Hant / en / ja / ko
  format: "deep-dive"   # deep-dive / brief / critique / debate
  length: "long"        # short / default / long

  # 筆記本層初始來源（所有集共用，在生成任何 episode 之前上傳）
  sources:
    - path: "./sources/moby_dick_overview.md"
      title: "白鯨記全書背景與簡介"

episodes:
  - title: "伊什梅爾的啟程"
    artifact_title: "EP01 伊什梅爾的啟程 — 深入白鯨記"  # 必填，生成後重命名 artifact
    sources:
      - path: "./sources/chapter_01.md"
        title: "白鯨記第一章"
    custom_prompt: |
      這是系列節目的第一集。

      本集重點——伊什梅爾的啟程與 19 世紀捕鯨業：

      1. 【開場】兩位主持人自我介紹，宣佈節目名稱，簡述這個系列要做什麼。
         語氣像兩個對文學充滿熱情的朋友，興奮地開始一個新企劃。

      2. 【文本朗讀與討論】選取第一章中 3-4 段最有代表性的段落，
         由 Leo 或 Ruby 其中一人朗讀英文原文，另一人在旁邊自然地補充感想。
         朗讀後兩人討論：
         - 伊什梅爾為什麼離開陸地？他的動機是逃避還是追尋？
         - "Call me Ishmael" 這句開場白為何成為文學史上最著名的開場之一？
         - 梅爾維爾用了哪些修辭手法讓讀者立刻進入伊什梅爾的世界？

      3. 【歷史背景】花 3-5 分鐘介紹 19 世紀美國捕鯨業：
         - 鯨油作為工業革命前的關鍵燃料
         - 南塔克特港的捕鯨文化
         - 水手的社會階層與生活條件
         用具體的數字和故事讓歷史背景活起來，不要只是乾巴巴地列事實。

      4. 【埋伏筆】在結尾預告下一集：「下一集我們將見到一位讓人不寒而慄的船長……」
         不要過度劇透，只給足夠的懸念。

      風格：學術但不沉悶，像兩個研究生在咖啡廳興奮地討論他們最愛的小說。
      語速適中，留給聽眾消化的時間。
    strategy: null  # 第一集不需要策略

  - title: "亞哈船長的執念"
    artifact_title: "EP02 亞哈船長的執念 — 深入白鯨記"
    sources:
      - path: "./sources/chapter_02_03.md"
        title: "白鯨記第二至三章"
    custom_prompt: |
      本集聚焦亞哈船長的角色塑造與其執念的心理學解讀。

      1. 【回顧銜接】快速回顧上一集討論的伊什梅爾——他的理性與好奇心。
         然後話鋒一轉：「但這艘船上有一個人，跟伊什梅爾完全相反……」

      2. 【角色分析】深入分析亞哈船長：
         - 他的外貌描寫如何暗示他的內心世界？
         - 他對白鯨的執念是復仇、證明自我、還是與命運的對抗？
         - 朗讀亞哈最具代表性的 2-3 段獨白，分析其中的象徵意義。
         Leo 和 Ruby 可以在這裡持有不同觀點，形成自然的辯論。

      3. 【心理學角度】用現代心理學觀點分析亞哈的行為：
         - 執念 (obsession) vs. 使命感 (mission) 的界線在哪裡？
         - 創傷後的行為改變——失去一條腿後他的世界觀如何扭曲？
         - 他對船員的領導力：魅力型領導還是獨裁暴君？

      4. 【對比結構】明確將亞哈與伊什梅爾做對比：
         理性 vs. 執念、觀察者 vs. 行動者、求知 vs. 復仇。
         這個對比是這個系列的核心張力。

      5. 【預告】結尾暗示下一集將討論白鯨本身的象徵意義。

      風格：這集的情緒應該比第一集更緊張、更有戲劇性。
      討論亞哈時語氣應該帶有敬畏和不安。
    strategy: "contradiction"  # 使用矛盾放大法

  - title: "白鯨的象徵"
    artifact_title: "EP03 白鯨的象徵 — 深入白鯨記"
    sources:
      - path: "./sources/chapter_04_06.md"
        title: "白鯨記第四至六章"
      - path: "./sources/literary_analysis.pdf"
        title: "學術論文：白鯨的多重象徵意義"
    custom_prompt: |
      探討白鯨作為文學象徵的多重解讀。

      1. 【回顧】快速帶過前兩集的重點：伊什梅爾的理性探索 vs. 亞哈的執念追獵。
         然後提問：「但他們追獵的那頭白鯨，到底代表什麼？」

      2. 【多重象徵解讀】依序探討至少四種解讀角度：
         (a) 自然的力量——白鯨作為不可馴服的大自然
         (b) 命運的不可抗拒——白鯨作為人類無法控制的命運
         (c) 人類執念的投射——白鯨只是一面鏡子，照出每個人內心的恐懼
         (d) 宗教象徵——白色在聖經中的意義 vs. 莫比·迪克的「白」
         每個角度都要引用原文作為論據，不能只是空泛地討論。

      3. 【辯論環節】Leo 和 Ruby 必須各選一個立場並用原文引用來辯護。
         一方主張白鯨是「善」的象徵（純潔、神聖），
         另一方主張白鯨是「惡」的象徵（恐怖、虛無）。
         辯論必須引用具體段落，不能只是表達感受。

      4. 【開放結尾】承認這個問題沒有標準答案，
         但指出梅爾維爾刻意製造的模糊性正是這部作品偉大之處。
         留下一個思考題給聽眾。

      風格：這集應該是整個系列最有深度的一集。
      語氣可以更學術、更嚴肅，但仍然保持可親近性。
    strategy: "dialectical"  # 使用動態辯證法

  - title: "季末回顧：未解之謎"
    artifact_title: "EP04 季末回顧：未解之謎 — 深入白鯨記"
    sources: []  # 不需新來源，依賴前三集的蒸餾摘要
    custom_prompt: |
      這是本季的最後一集。

      1. 【全面回顧】用 5-7 分鐘系統性回顧前三集的所有核心論點：
         - EP01 伊什梅爾的啟程：理性探索者的視角
         - EP02 亞哈的執念：非理性追獵的心理學
         - EP03 白鯨的象徵：多重解讀的張力
         不只是列清單，而是找出這三集之間的隱藏連結。

      2. 【遺漏分析】指出我們這個系列遺漏了哪些重要觀點：
         - 我們是否太聚焦在個人角色，忽略了其他船員的視角？
         - 梅爾維爾的寫作技法（如鯨魚學百科式的插敘）我們完全沒討論過
         - 小說的敘事結構——為什麼用第一人稱？伊什梅爾如何「存活」下來寫出這本書？
         誠實地承認局限性，不要假裝這個系列已經涵蓋了所有面向。

      3. 【第二季預告】提出三個值得深入探討的方向：
         (a) 其他角色的深度分析（冊封船長、魁奎格等）
         (b) 白鯨記的文學史地位：為何出版時無人問津，卻在 70 年後成為經典？
         (c) 現代重讀：白鯨記對當代環保主義、資本主義批判的啟示

      4. 【結語】感性收尾，感謝聽眾陪伴走過這四集的文學之旅。
         鼓勵聽眾去讀原著或重讀。

      風格：溫暖的總結感，帶有一點懷舊和感謝。
      語速可以稍慢，讓聽眾有時間消化和回味。
    strategy: "source_gap"  # 使用來源缺口探測法
