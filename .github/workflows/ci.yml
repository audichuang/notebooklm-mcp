name: ci

# retag-verified-latest.yml 依本 workflow(檔名 ci.yml)對 commit 的 run 結論移動 latest:別改名、別加 paths/schedule,時間變動的檢查放 deps-watch.yml。
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run --no-sync ruff check --output-format=github .
      - run: uv run --no-sync ruff format --check --diff .

  test-build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NBLM_STRICT_SKIPS: "1"
    steps:
      - name: Checkout notebooklm-mcp
        uses: actions/checkout@v4

      - name: Checkout audi-skill for sync check
        uses: actions/checkout@v4
        with:
          repository: audichuang/audi-skill
          path: audi-skill
          ssh-key: ${{ secrets.AUDI_SKILL_DEPLOY_KEY }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install ffmpeg
        # 沒裝時 5 支 _embed_cover/MP3 正規化測試會靜默 skip(本 repo 歷來 CI 602 skipped 就是這樣)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - name: Install project
        # --locked:lock 與 pyproject 不自洽就直接紅,而不是靜默重算 lock 再放行
        # (v0.9.23 tag 樹曾經 pyproject 0.9.23 / lock 0.9.21 卻 CI 全綠)。
        run: uv sync --locked

      - name: Run pytest
        run: uv run --no-sync pytest -q -ra --cov --cov-report=term-missing:skip-covered

      - name: Build wheel
        run: uv build

      - name: uv tool install wheel smoke
        run: |
          uv tool install --python 3.12 --force dist/*.whl
          # grep 我們自己的 usage 行,不是只看 exit code。相依套件可能宣告同名的 console
          # script,而同一個 tool venv 只留最後寫入的那份 —— 那時 `--help` 會成功地跑到
          # **別人的程式**。notebooklm-py 0.8.0 就這樣搶走了舊名 notebooklm-mcp
          # (全新安裝實測 3/3),我們因此改叫 nblm-mcp。見 docs/notebooklm-py-0.8-upgrade.md。
          nblm-mcp --help | grep -q "NotebookLM MCP server"
          notebooklm-cover --help

      - name: Skill docs sync check
        run: uv run python scripts/check_skill_sync.py
